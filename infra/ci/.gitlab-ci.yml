# Chaos Console — GitLab CI pipeline
# Test/lint/build gate, then a multi-arch (amd64+arm64) image from infra/Dockerfile
# pushed to a Sonatype Nexus Docker (hosted) repo.
#
# Point GitLab at this file: Settings > CI/CD > General pipelines >
#   "CI/CD configuration file" = infra/ci/.gitlab-ci.yml
#
# Set these CI/CD variables (Settings > CI/CD > Variables; mark the password
# "Masked" and ideally "Protected"):
#   NEXUS_REGISTRY  the Nexus Docker connector host:port, e.g. nexus.corp:8083
#   NEXUS_IMAGE     image path, e.g. chaos-console
#   NEXUS_USERNAME  Nexus account with push rights to that repo
#   NEXUS_PASSWORD  its password / token

stages: [verify, image]

verify:
  stage: verify
  image: node:24-slim
  before_script:
    - corepack enable && corepack prepare pnpm@9.7.0 --activate
  script:
    - pnpm install --frozen-lockfile
    - pnpm test
    - pnpm lint
    - pnpm -r build
  cache:
    key: pnpm-$CI_COMMIT_REF_SLUG
    paths: [.pnpm-store]

image:
  stage: image
  image: docker:27
  services: [docker:27-dind]
  variables:
    DOCKER_TLS_CERTDIR: "/certs"
  rules:
    - if: '$CI_COMMIT_TAG'                       # release build on a vX.Y.Z tag
    - if: '$CI_COMMIT_BRANCH == "main"'          # rolling :latest on main
    - if: '$CI_PIPELINE_SOURCE == "web"'         # manual "Run pipeline"
  before_script:
    - docker run --privileged --rm tonistiigi/binfmt --install all   # QEMU for arm64
    - docker buildx create --use
    - echo "$NEXUS_PASSWORD" | docker login "$NEXUS_REGISTRY" -u "$NEXUS_USERNAME" --password-stdin
  script:
    - IMAGE="$NEXUS_REGISTRY/${NEXUS_IMAGE:-chaos-console}"
    - TAG="${CI_COMMIT_TAG:-latest}"
    - >
      docker buildx build
      --platform linux/amd64,linux/arm64
      --file infra/Dockerfile
      --provenance=false
      --tag "$IMAGE:$TAG"
      --tag "$IMAGE:$CI_COMMIT_SHORT_SHA"
      --push .
